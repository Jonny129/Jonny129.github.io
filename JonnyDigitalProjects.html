<body>
<h1>My Digital Projects, By Jonathan Garcia</h1>
<div class=embed-box>
	<h2>My 1st Project: Infographic about a Place</h2>
	<iframe
	  src="https://express.adobe.com/embedLink/urn:aaid:sc:VA6C2:39b9e99f-30ab-5df3-b07f-df8fc3a301aa?promoid=Y69SGM5H&sdid=C4SZ2FYJ&mv=other"
	  width="1280"
	  height="720"
	  loading="lazy"
	  allowfullscreen="allowfullscreen"
	  allow="clipboard-write; fullscreen"
	  referrerpolicy="strict-origin-when-cross-origin"
	  frameborder="0"
	  style="width:80%; max-width:1280px; height:auto; aspect-ratio:1280/720; border:0; display:block; margin:0 auto;"
	></iframe>
<button class="likeButtons">Like</button>
<span class="numLikes">0</span>
</div>

<div class="embed-box">
	<h2> My 2nd Project: Video about My Day</h2>
	<iframe
	  src="https://express.adobe.com/embedLink/urn:aaid:sc:VA6C2:4f013f62-3c9a-58a9-b641-4126595e5091?promoid=Y69SGM5H&sdid=C4SZ2FYJ&mv=other"
	  width="1280"
	  height="720"
	  loading="lazy"
	  allowfullscreen="allowfullscreen"
	  allow="clipboard-write; fullscreen"
	  referrerpolicy="strict-origin-when-cross-origin"
	  frameborder="0"
	  style="width:80%; max-width:1280px; height:auto; aspect-ratio:1280/720; border:0; display:block; margin:0 auto;"
	></iframe>
<button class="likeButtons">Like</button>
<span class="numLikes">0</span>

<script type="module">
	
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
	import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
	
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyARBrKIs-w9gSqZnuzHLdHUvA56xmb6Q8Q",
      authDomain: "jonnylikebuttons1-cab0d.firebaseapp.com",
      projectId: "jonnylikebuttons1-cab0d",
      storageBucket: "jonnylikebuttons1-cab0d.firebasestorage.app",
      messagingSenderId: "601455425213",
      appId: "1:601455425213:web:6e58c8a9c904c6060429d4"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
	const db = getDatabase(app);
 
	const likeButtons = document.querySelectorAll(".likeButtons")
	const numLikes = document.querySelectorAll(".numLikes")

	for (let i=0; i<likeButtons.length; i++) {
		likeButtons[i].addEventListener('click', function(){ Like(i) })
		onValue(ref(db, "/project "+i+"/numLikes"), (snapshot) => {
			let data = snapshot.val();
			numLikes[i].innerHTML = data
		});
        
	}

	function Like(i) {
		let numberLikes = parseInt(numLikes[i].innerHTML)
		numberLikes = numberLikes + 1
		set(ref(db, "project " + i), {
			numLikes: numberLikes,
		});

	}
</script>

</div>

</body>
